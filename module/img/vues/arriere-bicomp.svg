<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="'Red Hat Display','Segoe UI',sans-serif">
  <!-- Vue arrière schématique d'une BOM bi-compartimentée : compartiment principal (chaises gauche et droite) + compartiment bicomp (chaise tout à droite) -->
  <rect width="900" height="640" fill="#EEF2F7"/>
  <line x1="0" y1="604" x2="900" y2="604" stroke="#B9C3D0" stroke-width="3"/>
  <!-- roues -->
  <rect x="58" y="520" width="62" height="80" rx="16" fill="#2B3445"/>
  <rect x="780" y="520" width="62" height="80" rx="16" fill="#2B3445"/>
  <!-- caisse -->
  <rect x="50" y="40" width="800" height="490" rx="14" fill="#FFFFFF" stroke="#1C3465" stroke-width="5"/>
  <rect x="50" y="40" width="800" height="34" rx="14" fill="#7FA127"/>
  <rect x="50" y="60" width="800" height="14" fill="#7FA127"/>
  <!-- feux -->
  <rect x="62" y="150" width="20" height="60" rx="6" fill="#C83F3F"/>
  <rect x="818" y="150" width="20" height="60" rx="6" fill="#C83F3F"/>
  <circle cx="120" cy="58" r="9" fill="#DB722E"/><circle cx="780" cy="58" r="9" fill="#DB722E"/>
  <!-- compartiment principal -->
  <rect x="100" y="110" width="410" height="290" rx="8" fill="#DCE3EE" stroke="#1C3465" stroke-width="3"/>
  <path d="M100 130 h410 M100 400 l40 -60 h330 l40 60" fill="none" stroke="#B9C3D0" stroke-width="3"/>
  <text x="305" y="160" text-anchor="middle" font-size="22" font-weight="700" fill="#1C3465">Compartiment principal</text>
  <!-- poteau central -->
  <rect x="512" y="90" width="76" height="440" fill="#FFFFFF" stroke="#1C3465" stroke-width="3"/>
  <!-- compartiment bicomp -->
  <rect x="590" y="110" width="215" height="290" rx="8" fill="#E3E9F7" stroke="#1C3465" stroke-width="3"/>
  <path d="M590 400 l26 -60 h163 l26 60" fill="none" stroke="#B9C3D0" stroke-width="3"/>
  <text x="697" y="160" text-anchor="middle" font-size="22" font-weight="700" fill="#1C3465">Bicomp</text>
  <!-- poteaux latéraux (boîtes à boutons) -->
  <rect x="70" y="220" width="30" height="110" rx="5" fill="#F5F7FA" stroke="#1C3465" stroke-width="2"/>
  <rect x="805" y="220" width="30" height="110" rx="5" fill="#F5F7FA" stroke="#1C3465" stroke-width="2"/>
  <g fill="#2B3445">
    <rect x="77" y="232" width="16" height="70" rx="3"/><rect x="537" y="232" width="16" height="70" rx="3"/><rect x="812" y="232" width="16" height="70" rx="3"/>
  </g>
  <g><circle cx="85" cy="244" r="4" fill="#C83F3F"/><circle cx="85" cy="258" r="4" fill="#7FA127"/><circle cx="545" cy="244" r="4" fill="#C83F3F"/><circle cx="545" cy="258" r="4" fill="#7FA127"/><circle cx="820" cy="244" r="4" fill="#C83F3F"/><circle cx="820" cy="258" r="4" fill="#7FA127"/></g>
  <!-- NBAB (boîtier arrière) -->
  <rect x="522" y="440" width="56" height="62" rx="6" fill="#1176AB" stroke="#1C3465" stroke-width="2"/>
  <rect x="530" y="450" width="40" height="16" rx="2" fill="#C8E6C9"/>
  <!-- lève-conteneurs : peigne + chaises + bacs -->
  <g stroke="#1C3465" stroke-width="3">
    <rect x="110" y="404" width="390" height="22" rx="4" fill="#5F6B7A"/>
    <rect x="600" y="404" width="195" height="22" rx="4" fill="#5F6B7A"/>
  </g>
  <g fill="#D35F2B" stroke="#8C3A17" stroke-width="3">
    <path d="M128 432 h176 l-10 120 h-156 z"/><path d="M318 432 h176 l-10 120 h-156 z"/><path d="M608 432 h176 l-10 120 h-156 z"/>
  </g>
  <g fill="#B54E22"><rect x="150" y="460" width="40" height="70" rx="4"/><rect x="232" y="460" width="40" height="70" rx="4"/><rect x="340" y="460" width="40" height="70" rx="4"/><rect x="422" y="460" width="40" height="70" rx="4"/><rect x="630" y="460" width="40" height="70" rx="4"/><rect x="712" y="460" width="40" height="70" rx="4"/></g>
  <!-- dents antenne (centre de chaque peigne) et décodeurs -->
  <g fill="#1C3465"><rect x="200" y="400" width="30" height="30" rx="4"/><rect x="390" y="400" width="30" height="30" rx="4"/><rect x="680" y="400" width="30" height="30" rx="4"/></g>
  <g fill="#9AA5B4" stroke="#1C3465" stroke-width="2"><rect x="130" y="372" width="40" height="26" rx="4"/><rect x="320" y="372" width="40" height="26" rx="4"/><rect x="610" y="372" width="40" height="26" rx="4"/></g>
  <!-- marchepieds -->
  <rect x="20" y="540" width="80" height="20" rx="4" fill="#F2C94C" stroke="#2B3445" stroke-width="3"/>
  <rect x="800" y="540" width="80" height="20" rx="4" fill="#F2C94C" stroke="#2B3445" stroke-width="3"/>
  <!-- repères des chaises -->
  <g font-size="20" font-weight="700" fill="#1C3465" text-anchor="middle">
    <text x="216" y="590">Chaise gauche</text><text x="406" y="590">Chaise droite</text><text x="696" y="590">Chaise bicomp</text>
  </g>
</svg>
